server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mindcure_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:theskysid}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

jwt:
  secretkey: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:3600000} # 1 hour

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.theskysid: ${LOGGING_LEVEL_COM_THESKYSID:DEBUG}
